[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "dse-vocab-growth"
dynamic = ["version"]
description = "Models of vocabulary growth in children with Down syndrome"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Frank Buckley" }]

dependencies = [
  "arviz-plots>=1.2.0",
  "arviz-stats>=1.2.0",
  "arviz>=1.2.0",
  "duckdb>=1.5.5",
  "dse-research-utils>=0.9.0",
  "jaxlib>=0.10.2",
  "matplotlib>=3.11.1",
  "numpy>=2.4.6,<2.5",  # pymc -> pytensor -> numba pins numpy <2.5; matches the shared conda core
  "numpyro>=0.21.0",
  "nutpie>=0.16.11",
  "pandas>=3.0.5",
  "preliz>=0.27.1",
  "pymc>=6.2.0",
  "scipy>=1.18.0",
  "rich>=15.0.0",
  "xarray>=2026.7.0"
]

[project.optional-dependencies]
dev = [
  "ipython>=9.13.0",
  "ipywidgets>=8.1.8",
  "notebook>=7.5.6",
  "pytest>=9.1.1",
  "ruff>=0.16.1"
]

[tool.uv.sources]
# dse-research-utils isn't published to PyPI — resolve it from the public git
# tag. (The conda env in environment.yml installs it from the same tag in its
# pip layer; this entry is only consumed by uv.)
dse-research-utils = { git = "https://github.com/dseinternational/research.git", subdirectory = "src/python", tag = "v0.9.0" }

[tool.hatch.version]
path = "src/vocab_growth/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vocab_growth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line too long — long lines acceptable in scientific/modelling code
    "E741",  # ambiguous variable name — mathematical names (l, X, y) are meaningful
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = [
    "B018",  # notebook display expressions are intentional in Jupytext percent files
]

[tool.ruff.lint.isort]
known-first-party = ["vocab_growth"]
