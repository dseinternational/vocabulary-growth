[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "dse-vocab-growth"
dynamic = ["version"]
description = "Models of vocabulary growth in children with Down syndrome"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Frank Buckley" }]

# The scientific stack is inherited transitively rather than restated here: the
# canonical floors (numpy/scipy/pandas/pymc/pytensor/nutpie/arviz/preliz/xarray/
# …) live in dse-research-utils' own pyproject.toml, so they cannot drift
# between the repositories that share them. Only the extras this repository
# actually needs are named:
#   columnar  duckdb — the prepared-data store (also brings polars, pyreadstat)
#   graphs    graphviz bindings for the model DAG (needs the system `dot` too)
#   io        orjson / tabulate, used by the shared reporting helpers
#   jax       jax + numpyro — imported directly (jax.numpy, jax.scipy.special)
#   notebook  jupyter + jupytext — Jupytext notebooks and Quarto's kernel
#   viz       seaborn
# `storage` is deliberately absent: since dse-research-utils v0.11.1 h5netcdf
# and h5py — the netCDF engine trace.nc is written with, and imported directly
# by the model reports to inspect a trace before opening it — are core
# dependencies, leaving that extra carrying only zarr, which nothing here
# imports. Dropping it changes nothing in the resolved environment (nutpie
# depends on zarr regardless); it stops us declaring a need we do not have.
# nutpie is deliberately absent: PyMC 6 declares it as `pymc[nutpie]` and
# auto-selects it as the default NUTS sampler when present, so it is a base
# dependency of dse-research-utils to keep the sampler identical across repos.
dependencies = [
  "dse-research-utils[columnar,graphs,io,jax,notebook,viz]"
]

[dependency-groups]
# Development-only tooling. A PEP 735 group is never written into published
# package metadata, so none of this reaches anything that depends on us.
#
# `lint` is split out so CI's lint job can install ruff alone. Left inside
# `dev`, `uv run ruff` syncs the whole project environment — 174 packages,
# PyMC and JAX among them — to run a self-contained Rust binary.
lint = [
  "ruff>=0.16.1"
]
# Static type checking, split out for the same reason `lint` is: mypy reads
# source rather than importing it, so the narrow set of modules it covers can be
# checked without syncing PyMC, JAX and ArviZ to do it.
typecheck = [
  "mypy>=2.3.1"
]
dev = [
  "ipython>=9.13.0",
  "ipywidgets>=8.1.8",
  "pytest>=9.1.1",
  # The suite is dominated by a handful of model builds and sampler runs, which
  # parallelise cleanly: every model build writes under its own `tmp_path`, so
  # there is no shared state between workers. See
  # `notes/202608241530-test-suite-performance.md`.
  "pytest-xdist>=3.8.0",
  { include-group = "lint" },
  { include-group = "typecheck" }
]

[tool.uv]
# Platforms the lockfile resolves for — the same set as dse-research-utils.
# Intel macOS is absent because numba publishes no macOS x86_64 wheels, an
# upstream decision. Native win-amd64 is now covered: jaxlib, which had no
# conda-forge win-64 build, ships a cp314 wheel on PyPI, so Windows
# contributors no longer need WSL.
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'"
]

[tool.uv.sources]
# dse-research-utils isn't published to PyPI — resolve it from the public git
# tag. To develop against a sibling checkout instead, comment this out and use:
#   dse-research-utils = { path = "../research/src/python", editable = true }
dse-research-utils = { git = "https://github.com/dseinternational/research.git", subdirectory = "src/python", tag = "v0.12.3" }

[tool.hatch.version]
path = "src/vocab_growth/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vocab_growth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `not slow` by default, so the inner loop stays short. The deselected count is
# printed on every run, and CI overrides it with `-m ""` so nothing is skipped
# where it matters — see the `Test` section of AGENTS.md for both commands.
addopts = "-q -m 'not slow'"
markers = [
    "slow: real sampling, compilation or numerical optimisation — minutes, not seconds. Deselected by default; CI runs them with `-m \"\"`.",
    "emits_reporting_artefacts: opts out of the conftest fixture that silences the fit pipeline's console and figure output, for the tests that assert those artefacts are still produced.",
]

[tool.mypy]
# Deliberately narrow (issue #273). These are the modules that *declare* things
# -- the model definitions, the catalogue, the child-effect plan and the
# analysis-frame mapping derived from it -- and they are where an annotation
# that quietly disagrees with the value does real damage: `tau_subj_u_sigma`
# was annotated `float` while three registered models put an object in it, and
# `TrivariateModelDefinition.kappa_u` said `KappaPriorParams` while VG14 and
# VG15 both passed the two-anchor form. Both were found by turning this on.
#
# The PyMC graph code is **not** covered and should not be until these are
# stable: PyTensor's tensor algebra is not usefully typed, and the noise would
# bury findings like the two above.
files = [
  "src/vocab_growth/analysis_frames.py",
  "src/vocab_growth/models/catalogue.py",
  "src/vocab_growth/models/definitions.py",
  "src/vocab_growth/models/subject_effects.py"
]
python_version = "3.14"
# The scientific stack ships partial or absent stubs and is not what is being
# checked here; a missing stub must not become a finding.
ignore_missing_imports = true
# Only the listed files are analysed. Without this, mypy follows first-party
# imports into the engines and reports on the graph code this deliberately
# excludes.
follow_imports = "silent"

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line too long — long lines acceptable in scientific/modelling code
    "E741",  # ambiguous variable name — mathematical names (l, X, y) are meaningful
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = [
    "B018",  # notebook display expressions are intentional in Jupytext percent files
]

[tool.ruff.lint.isort]
known-first-party = ["vocab_growth"]

