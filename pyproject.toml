[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "dse-vocab-growth"
dynamic = ["version"]
description = "Models of vocabulary growth in children with Down syndrome"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Frank Buckley" }]

dependencies = [
  "numpy>=2.4.4",
  "pandas>=3.0.3",
  "duckdb>=1.5.2",
  "preliz>=0.18.0",
  "pymc>=5.28.4,<6.0",
  "nutpie>=0.16.8",
  "jaxlib>=0.9.2",
  "numpyro>=0.20.0",
  "arviz>=1.1.0",
  "arviz-stats>=1.1.0",
  "arviz-plots>=1.1.0",
  "matplotlib>=3.10.9",
  "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = [
  "notebook>=7.5.6",
  "ipython>=9.13.0",
  "ipywidgets>=8.1.8",
  "pytest>=9.0.3",
  "ruff>=0.15.13",
]

[tool.hatch.version]
path = "src/vocab_growth/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vocab_growth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line too long — long lines acceptable in scientific/modelling code
    "E741",  # ambiguous variable name — mathematical names (l, X, y) are meaningful
]

[tool.ruff.lint.isort]
known-first-party = ["vocab_growth"]
