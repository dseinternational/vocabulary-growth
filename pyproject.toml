[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "dse-vocab-growth"
dynamic = ["version"]
description = "Models of vocabulary growth in children with Down syndrome"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Frank Buckley" }]

# Scientific dependency floors come from dse-research-utils. Extras add the
# columnar store, Graphviz bindings, IO helpers, JAX, notebooks and plotting.
# h5netcdf, h5py and the sampler are shared core dependencies.
dependencies = [
  "dse-research-utils[columnar,graphs,io,jax,notebook,viz]"
]

[dependency-groups]
# Separate lint and typecheck groups let CI install those tools without the
# scientific stack. Development groups do not enter wheel dependency metadata.
lint = [
  "ruff>=0.16.10"
]
typecheck = [
  "mypy>=2.4.0"
]
dev = [
  "ipython>=9.17.1",
  "ipywidgets>=8.1.9",
  "pytest>=9.1.1",
  # Tests with costly shared fixtures use xdist_group marks for slow runs.
  "pytest-xdist>=3.8.0",
  { include-group = "lint" },
  { include-group = "typecheck" }
]

[tool.uv]
# Resolve the CPU lock on the four supported platforms.
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'"
]

[tool.uv.sources]
# Pin the shared library to a reviewed release tag. For local development, replace
# this entry with the sibling checkout source below, then refresh the lock.
# dse-research-utils = { path = "../research/src/python", editable = true }
dse-research-utils = { git = "https://github.com/dseinternational/research.git", subdirectory = "src/python", tag = "v0.18.0" }

[tool.hatch.version]
path = "src/vocab_growth/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vocab_growth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `not slow` by default, so the inner loop stays short. The deselected count is
# printed on every run. CI runs the fast and slow sets in separate jobs; see
# the Environment and checks section of AGENTS.md for both commands.
addopts = "-q -m 'not slow'"
markers = [
    "slow: real sampling, compilation or numerical optimisation — minutes, not seconds. Deselected by default; the `tests-slow` CI job runs them with `-m \"slow\"`.",
    "emits_reporting_artefacts: opts out of the conftest fixture that silences the fit pipeline's console and figure output, for the tests that assert those artefacts are still produced.",
]

[tool.mypy]
# Check the declaration modules. PyTensor graph code lies outside this scope.
files = [
  "src/vocab_growth/analysis_frames.py",
  "src/vocab_growth/models/catalogue.py",
  "src/vocab_growth/models/definitions.py",
  "src/vocab_growth/models/subject_effects.py"
]
python_version = "3.14"
# The scientific stack ships partial or absent stubs and is not what is being
# checked here; a missing stub must not become a finding.
ignore_missing_imports = true
# Only the listed files are analysed. Without this, mypy follows first-party
# imports into the engines and reports on the graph code this deliberately
# excludes.
follow_imports = "silent"

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line too long — long lines acceptable in scientific/modelling code
    "E741",  # ambiguous variable name — mathematical names (l, X, y) are meaningful
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = [
    "B018",  # notebook display expressions are intentional in Jupytext percent files
]

[tool.ruff.lint.isort]
known-first-party = ["vocab_growth"]
