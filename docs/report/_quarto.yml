project:
  type: book

  output-dir: ../../output/report

  preview:
    port: 4200
    browser: true
    watch-inputs: true

jupyter: python3

execute:
  # `auto` re-executes a chapter when its source changes; `true` never does, and
  # silently served a stale results chapter after its cells had been rewritten.
  #
  # `auto` is not sufficient on its own. It hashes a chapter's OWN source and not
  # the files it transcludes, and the frozen result stores the document with
  # includes already resolved — so editing `_caveats-signing.qmd` or
  # `_report_data.qmd` and re-rendering leaves the old text in the output with no
  # warning (hit 2026-08-16, a caveat edit that rendered as its pre-edit self).
  # After editing any `_*.qmd`, delete `_freeze/<chapter>/` for every chapter that
  # includes it. `_report_data.qmd` is included by nearly all of them.
  freeze: auto

date: now

toc: true
toc-depth: 2

number-sections: true
number-depth: 3

# Figures are referenced without an extension; resolve to the PNG that the model
# plotting emits (both HTML and PDF use PNG — no SVG->PDF conversion needed).
default-image-extension: png

bibliography: references.bib
csl: apa.csl

language:
  crossref-ch-prefix: "Section"

book:
  output-file: vocabulary-growth-report
  title: "Vocabulary growth in children with Down syndrome"
  author:
    - name: Frank Buckley
      orcid: 0000-0002-9708-2705
      affiliations:
        - name: Down Syndrome Education International
          state: Cumbria
          country: UK
      roles: writing
      corresponding: true
    - name: Sue Buckley
      orcid: 0000-0002-9044-3088
      affiliations:
        - name: Down Syndrome Education International
          state: Cumbria
          country: UK
        - name: University of Portsmouth
          city: Portsmouth
          state: Hampshire
          country: UK
      roles: writing
  chapters:
    - index.qmd
    - acknowledgements.qmd
    - summary.qmd
    - glossary.qmd
    - part: "Background, aims and approach"
      chapters:
        - intro.qmd
        - intro-language-development.qmd
    - part: "Methods"
      chapters:
        - methods-data.qmd
        - methods-models.qmd
    - part: "Results"
      chapters:
        - results.qmd
    - part: "Discussion"
      chapters:
        - discussion.qmd
    - part: "Appendices"
      chapters:
        - appendix-ai.qmd
        - references.qmd

format:
  html:
    code-fold: true
    theme: default
  docx:
    reference-doc: ../template.docx
  pdf:
    documentclass: report
    papersize: a4
    colorlinks: true
    link-citations: true
    fontsize: 11pt
    mainfont: "Source Sans 3"
    sansfont: "Source Sans 3"
    monofont: "Monaspace Neon"
    monofontoptions: "Scale=0.8125"
    linestretch: 1.25
    geometry:
      - top=25mm
      - left=25mm
      - right=25mm
      - bottom=25mm
    include-in-header: footer.tex
