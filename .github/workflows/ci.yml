name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# One run per branch: a new push to a pull request cancels the run still in
# flight for it. Pushes to main are never cancelled, so every commit on the
# default branch keeps its own complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run spellcheck
        run: npm run spellcheck

      - name: Check formatting
        run: npm run format:check

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Lint
        run: uv run ruff check src/ scripts/

  model-fit-tests:
    strategy:
      fail-fast: false
      matrix:
        # Native Windows is now covered. It was previously omitted because
        # jax/jaxlib have no conda-forge win-64 build, which forced Windows
        # contributors onto WSL; on PyPI jaxlib publishes cp314 win_amd64
        # wheels, so the whole stack installs natively.
        #
        # macOS (osx-arm64) is the local development platform and is exercised
        # there, so CI does not spend a third full run on it. Intel macOS is
        # absent because upstream has dropped it: numba ships no macosx x86_64
        # wheels at all. See `tool.uv.environments` in pyproject.toml.
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --locked fails the build if uv.lock is stale rather than silently
      # resolving something different from what was reviewed. uv provisions the
      # interpreter itself from .python-version, so there is no setup-python
      # step.
      - name: Install the locked environment
        run: uv sync --locked

      # Before pytest, not after: the tests that pin the study-level inclusion
      # counts quoted in the notes and the report open the real database rather
      # than a miniature fixture, and skip when it is absent. Building it costs
      # ~300 ms, so running those assertions is effectively free — and a suite
      # that silently skipped them would report green while the counts drifted.
      - name: Prepare data
        run: uv run --no-sync python scripts/prepare_data.py

      - name: Run pytest
        run: uv run --no-sync pytest

      - name: Fit model VG01 (dev)
        run: uv run --no-sync python scripts/fit_model.py vg01 --config dev
