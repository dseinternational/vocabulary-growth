name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run spellcheck
        run: npm run spellcheck

      - name: Check formatting
        run: npm run format:check

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src/ scripts/

  model-fit-tests:
    strategy:
      fail-fast: false
      matrix:
        # Native Windows is intentionally omitted: jax/jaxlib have no conda-forge
        # win-64 build, so the compiled stack cannot solve there. Windows users
        # work in Ubuntu on WSL (linux-64), which the ubuntu runner covers.
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup conda environment
        uses: mamba-org/setup-micromamba@v3.0.0
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Verify environment core matches the canonical spec
        run: dse-check-env environment.yml

      - name: Run pytest
        run: pytest

      - name: Prepare data
        run: python scripts/prepare_data.py

      - name: Fit model VG01 (dev)
        run: python scripts/fit_model.py vg01 --config dev
