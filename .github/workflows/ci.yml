name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# One run per branch: a new push to a pull request cancels the run still in
# flight for it. Pushes to main are never cancelled, so every commit on the
# default branch keeps its own complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run spellcheck
        run: npm run spellcheck

      - name: Check formatting
        run: npm run format:check

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src/ scripts/

  # Linux only. Native Windows cannot solve the compiled stack at all
  # (jax/jaxlib have no conda-forge win-64 build); Windows users work in Ubuntu
  # on WSL, which is linux-64 and so is covered here. macOS (osx-arm64) is the
  # local development platform and is exercised there; conda-lock.yml pins it,
  # so CI does not spend a second full environment solve on it.
  model-fit-tests:
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup conda environment
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Verify environment core matches the canonical spec
        run: dse-check-env environment.yml

      # Before pytest, not after: the tests that pin the study-level inclusion
      # counts quoted in the notes and the report open the real database rather
      # than a miniature fixture, and skip when it is absent. Building it costs
      # ~300 ms, so running those assertions is effectively free — and a suite
      # that silently skipped them would report green while the counts drifted.
      - name: Prepare data
        run: python scripts/prepare_data.py

      - name: Run pytest
        run: pytest

      - name: Fit model VG01 (dev)
        run: python scripts/fit_model.py vg01 --config dev
