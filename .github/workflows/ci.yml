name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# One run per branch: a new push to a pull request cancels the run still in
# flight for it. Pushes to main are never cancelled, so every commit on the
# default branch keeps its own complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spellcheck:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          # cspell ships its dictionaries as packages; without this the whole
          # tree is re-downloaded on every run.
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run spellcheck
        run: npm run spellcheck

      - name: Check formatting
        run: npm run format:check

  lint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # `uv run ruff` on its own syncs the whole project environment — 174
      # packages, PyMC, JAX and ArviZ among them — to run a self-contained Rust
      # binary. uv's cache makes that cheap when it is warm (287 ms on the run
      # this replaced), so the saving is a few seconds rather than minutes; the
      # point is that the job no longer depends on that cache being warm. The
      # `lint` group holds ruff alone, at the version uv.lock pins.
      - name: Install ruff
        run: uv sync --locked --only-group lint

      - name: Lint
        run: uv run --no-sync ruff check src/ scripts/ tests/

      # Targeted static type checking (issue #273). Narrow on purpose: the
      # modules that declare the model definitions, the catalogue, the
      # child-effect plan and the analysis-frame mapping, where an annotation
      # that disagrees with the value does real damage. mypy reads source rather
      # than importing it, so this needs no scientific stack — the `typecheck`
      # group holds mypy alone, at the version uv.lock pins. See the file list
      # in `[tool.mypy]`.
      - name: Install mypy
        run: uv sync --locked --only-group typecheck

      - name: Type check
        run: uv run --no-sync mypy

  # Classifies the change so the heavy jobs can skip documentation-only work:
  # 8 of the 19 main commits before this job existed touched only notes, report
  # chapters or Markdown, and each paid the full test-and-fit pipeline for it
  # (notes/202608281312-ci-critical-path.md). Two carve-outs stay "code"
  # deliberately: the three agent-instruction copies, whose byte-for-byte
  # agreement a test compares (tests/test_environment_locks.py), and
  # docs/models/**, which the fit pipeline's report stage copies. Anything
  # unrecognised counts as code, so a new file class fails toward running the
  # tests rather than silently skipping them. Skipped jobs satisfy required
  # status checks, so this gate cannot block a merge.
  changes:
    runs-on: ubuntu-26.04-arm
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # The checkout is the merge commit (base + this PR), so a plain
            # two-endpoint diff against the base head is exactly the PR's
            # changes, and it works on a depth-1 clone.
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git fetch --no-tags --depth=1 origin "$base"; then
            # New branch, force push, or an unfetchable base: run everything.
            echo "No usable base commit; treating the change as code."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          printf 'Changed files:\n%s\n' "$changed"
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              CLAUDE.md|AGENTS.md|.github/copilot-instructions.md) code=true ;;
              docs/models/*) code=true ;;
              notes/*|docs/*) ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The suite in two halves whose union is everything `-m "slow or not slow"`
  # selects. The split buys feedback latency, not total wall time: the slow
  # half is bounded by two compile-heavy serial units that no rebalancing can
  # shrink (notes/202608281312-ci-critical-path.md §2), so most failures now
  # surface from the fast half in a couple of minutes instead of waiting behind
  # them. `--dist loadfile` keeps each module's fixtures on one worker, which
  # matters for the modules whose fixture is itself a fit; `--durations=25`
  # keeps the slowest tests visible so growth in the floor is noticed rather
  # than discovered (the suite grew 20% in the four days after the 2026-08-24
  # timing pass).
  tests-fast:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    # PEP 686 makes UTF-8 mode the default from Python 3.15.
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Prepare data
        run: uv run --no-sync python scripts/prepare_data.py

      - name: Run pytest (fast set)
        run: uv run --no-sync pytest -n auto --dist loadfile -m "not slow" --durations=25

  tests-slow:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Prepare data
        run: uv run --no-sync python scripts/prepare_data.py

      # The four `slow` modules do real sampling, compilation or numerical
      # optimisation; on four workers each gets a core to itself.
      - name: Run pytest (slow set)
        run: uv run --no-sync pytest -n auto --dist loadfile -m "slow" --durations=25

  # Split from the test jobs: none needs another's result, and the fit is an
  # end-to-end smoke of the whole pipeline that pytest does not replace.
  model-fit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Prepare data
        run: uv run --no-sync python scripts/prepare_data.py

      - name: Fit model VG01 (dev)
        run: uv run --no-sync python scripts/fit_model.py vg01 --config dev
