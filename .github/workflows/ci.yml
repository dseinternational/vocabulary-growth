name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# One run per branch: a new push to a pull request cancels the run still in
# flight for it. Pushes to main are never cancelled, so every commit on the
# default branch keeps its own complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spellcheck:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run spellcheck
        run: npm run spellcheck

      - name: Check formatting
        run: npm run format:check

  lint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Lint
        run: uv run ruff check src/ scripts/

  model-fit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    # PEP 686 makes UTF-8 mode the default from Python 3.15.
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Prepare data
        run: uv run --no-sync python scripts/prepare_data.py

      - name: Run pytest
        run: uv run --no-sync pytest

      - name: Fit model VG01 (dev)
        run: uv run --no-sync python scripts/fit_model.py vg01 --config dev
