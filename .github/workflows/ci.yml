name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# One run per branch: a new push to a pull request cancels the run still in
# flight for it. Pushes to main are never cancelled, so every commit on the
# default branch keeps its own complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spellcheck:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          # cspell ships its dictionaries as packages; without this the whole
          # tree is re-downloaded on every run.
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run spellcheck
        run: npm run spellcheck

      - name: Check formatting
        run: npm run format:check

      # Every note has a row in the notes index, and every row a note. This runs
      # here, in a job with no `changes` gate, because `notes/*` classifies as
      # documentation below and so skips the test jobs -- which is precisely the
      # change that adds a note and forgets its row. The check is stdlib-only
      # and the file is an ordinary pytest module besides, so `uv run pytest`
      # and `tests-fast` cover it too; this step is the one that runs when they
      # do not. Ten notes had drifted out of the index before it existed.
      - name: Check the notes index
        run: python3 tests/test_notes_index.py

  lint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # `uv run ruff` on its own syncs the whole project environment — 174
      # packages, PyMC, JAX and ArviZ among them — to run a self-contained Rust
      # binary. uv's cache makes that cheap when it is warm (287 ms on the run
      # this replaced), so the saving is a few seconds rather than minutes; the
      # point is that the job no longer depends on that cache being warm. The
      # `lint` group holds ruff alone, at the version uv.lock pins.
      - name: Install ruff
        run: uv sync --locked --only-group lint

      - name: Lint
        run: uv run --no-sync ruff check src/ scripts/ tests/

      # Targeted static type checking (issue #273). Narrow on purpose: the
      # modules that declare the model definitions, the catalogue, the
      # child-effect plan and the analysis-frame mapping, where an annotation
      # that disagrees with the value does real damage. mypy reads source rather
      # than importing it, so this needs no scientific stack — the `typecheck`
      # group holds mypy alone, at the version uv.lock pins. See the file list
      # in `[tool.mypy]`.
      - name: Install mypy
        run: uv sync --locked --only-group typecheck

      - name: Type check
        run: uv run --no-sync mypy

  # Classifies the change so the heavy jobs can skip documentation-only work:
  # 8 of the 19 main commits before this job existed touched only notes, report
  # chapters or Markdown, and each paid the full test-and-fit pipeline for it
  # (notes/202608281312-ci-critical-path.md). Two carve-outs stay "code"
  # deliberately: the three agent-instruction copies, whose byte-for-byte
  # agreement a test compares (tests/test_environment_locks.py), and
  # docs/models/**, which the fit pipeline's report stage copies. Anything
  # unrecognised counts as code, so a new file class fails toward running the
  # tests rather than silently skipping them. Skipped jobs satisfy required
  # status checks, so this gate cannot block a merge.
  changes:
    runs-on: ubuntu-26.04-arm
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # The checkout is the merge commit (base + this PR), so a plain
            # two-endpoint diff against the base head is exactly the PR's
            # changes, and it works on a depth-1 clone.
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git fetch --no-tags --depth=1 origin "$base"; then
            # New branch, force push, or an unfetchable base: run everything.
            echo "No usable base commit; treating the change as code."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          printf 'Changed files:\n%s\n' "$changed"
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              CLAUDE.md|AGENTS.md|.github/copilot-instructions.md) code=true ;;
              docs/models/*) code=true ;;
              notes/*|docs/*) ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The suite in two halves whose union is everything `-m "slow or not slow"`
  # selects. The split buys feedback latency: most failures surface from the
  # fast half in a couple of minutes instead of waiting behind the compile-heavy
  # half. It was recorded here that the slow half was "bounded by two
  # compile-heavy serial units that no rebalancing can shrink"
  # (notes/202608281312-ci-critical-path.md §2); that had gone stale, and
  # rebalancing it is worth 2.9x on four workers -- see the `tests-slow`
  # comment below and notes/202609101310-slow-test-distribution.md. The two jobs
  # therefore distribute differently: `tests-fast` keeps `--dist loadfile`,
  # which holds each module's fixtures on one worker and matters for the modules
  # whose fixture is itself a fit. `--durations=25` on both keeps the slowest
  # tests visible so growth in the floor is noticed rather than discovered (the
  # suite grew 20% in the four days after the 2026-08-24 timing pass).
  tests-fast:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    # PEP 686 makes UTF-8 mode the default from Python 3.15.
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      # PyTensor compiles the model graphs to C (and numba) on first use and
      # keys the result by the generated code, so a cold compiledir means every
      # graph in the job is compiled from scratch -- and compilation, not
      # sampling, is what these jobs cost. Measured on this runner, same commit,
      # `tests-slow`'s pytest step: **7 m 25 s on the cold run that populated the
      # cache against 4 m 16 s on the next one**, restoring 24 MB. Two fifths of
      # the job was work a previous run had already done.
      #
      # The key is deliberately strict and carries **no `restore-keys`**. A
      # stale numba function cache is not hypothetical here: on 2026-09-10 a
      # pytensor/numba bump left `CPUDispatcher` entries that produced a typing
      # error surviving reruns until they were deleted by hand. `uv.lock` pins
      # every package, so hashing it means any version move gives a new key and
      # a cold, correct compiledir; a loose prefix key would restore exactly the
      # cache that failure mode needs. The cost of the strictness is an
      # occasional cold run after an unrelated dependency bump, which is the
      # right way round.
      - name: Cache the PyTensor compiledir
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pytensor
          key: pytensor-fast-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.python-version', 'uv.lock') }}

      - name: Prepare data
        run: uv run --no-sync python scripts/prepare_data.py

      - name: Run pytest (fast set)
        run: uv run --no-sync pytest -n auto --dist loadfile -m "not slow" --durations=25

  tests-slow:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      # As in `tests-fast` above: a cold compiledir recompiles every graph, and
      # the key hashes `uv.lock` so a version bump is cold rather than stale.
      - name: Cache the PyTensor compiledir
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pytensor
          key: pytensor-slow-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.python-version', 'uv.lock') }}

      - name: Prepare data
        run: uv run --no-sync python scripts/prepare_data.py

      # `loadgroup`, not `loadfile`: the slow set's cost is concentrated in one
      # module (`test_prior_table_coverage.py`, 106 of the set's 301 tests and
      # 45% of its CPU), and `loadfile` pinned that whole module to a single
      # worker, so the job could not finish faster than that one file -- 592 s
      # of a 592 s run. Its tests share nothing, so they distribute per test;
      # the three modules that *do* share an expensive module-scoped fixture
      # carry an `xdist_group` mark and still travel together. Measured 592 s
      # -> 207 s on four workers, and the run is now balanced rather than
      # critical-path bound: it scales with the worker count, which it did not
      # before.
      # See notes/202609101310-slow-test-distribution.md.
      - name: Run pytest (slow set)
        run: uv run --no-sync pytest -n auto --dist loadgroup -m "slow" --durations=25

  # Split from the test jobs: none needs another's result, and the fit is an
  # end-to-end smoke of the whole pipeline that pytest does not replace.
  model-fit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      # As in `tests-fast` above: a cold compiledir recompiles every graph, and
      # the key hashes `uv.lock` so a version bump is cold rather than stale.
      - name: Cache the PyTensor compiledir
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pytensor
          key: pytensor-fit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.python-version', 'uv.lock') }}

      - name: Prepare data
        run: uv run --no-sync python scripts/prepare_data.py

      - name: Fit model VG01 (dev)
        run: uv run --no-sync python scripts/fit_model.py vg01 --config dev
