version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: "Europe/London"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # numpy 2.5 is unreachable for anything depending on pymc: pytensor 3.2.x
      # pins numba <=0.66.0, and numba 0.66.0 still pins numpy <2.5. The ceiling
      # in pyproject.toml mirrors the shared conda core; raising it only declares
      # a range no resolver can use. Remove once numba supports numpy 2.5.
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
    assignees:
      - frankbuckley

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: "Europe/London"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    assignees:
      - frankbuckley

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: "Europe/London"
    groups:
      github-actions:
        patterns:
          - "*"
    assignees:
      - frankbuckley
