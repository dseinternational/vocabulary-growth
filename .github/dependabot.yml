version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: "wednesday"
      time: "02:22"
      timezone: "Europe/London"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # numpy 2.6 is unreachable for anything depending on pymc: pytensor 3.3.1
      # pins numba <=0.67.0, and numba 0.67.0 pins numpy <2.6. The ceiling is
      # inherited from dse-research-utils; raising it here only declares a range
      # no resolver can use. Remove once a PyTensor release admits a numba that
      # has relaxed past numpy <2.6.
      - dependency-name: "numpy"
        versions: [">=2.6.0"]
    assignees:
      - frankbuckley

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: "wednesday"
      time: "02:43"
      timezone: "Europe/London"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    assignees:
      - frankbuckley

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: "wednesday"
      time: "02:12"
      timezone: "Europe/London"
    groups:
      github-actions:
        patterns:
          - "*"
    assignees:
      - frankbuckley
