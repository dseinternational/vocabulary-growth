version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: "wednesday"
      time: "02:22"
      timezone: "Europe/London"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # numpy 2.5 is unreachable for anything depending on pymc: pytensor 3.3.0
      # pins numba <=0.66.0, and numba 0.66.0 still pins numpy <2.5. The ceiling
      # is inherited from dse-research-utils; raising it here only declares a
      # range no resolver can use. Remove once a PyTensor release admits numba
      # 0.67, which has relaxed to numpy <2.6.
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
    assignees:
      - frankbuckley

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: "wednesday"
      time: "02:43"
      timezone: "Europe/London"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    assignees:
      - frankbuckley

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: "wednesday"
      time: "02:12"
      timezone: "Europe/London"
    groups:
      github-actions:
        patterns:
          - "*"
    assignees:
      - frankbuckley
