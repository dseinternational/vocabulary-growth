---
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: '0.2'
language: en-GB
import:
    - '@cspell/dict-it-it/cspell-ext.json'
dictionaryDefinitions:
    - name: en
      path: './config/spellcheck/allow-en.txt'
      addWords: true
    - name: it
      path: './config/spellcheck/allow-it.txt'
      addWords: true
dictionaries:
    - en
overrides:
    - filename: '**/*-it.md'
      language: 'it,en-GB'
      dictionaries:
          - en
          - it
ignorePaths:
    - 'node_modules'
    - 'config/**'
    # Standalone literature review: an 88-entry spelled-out bibliography of
    # international author names yields only false positives. References in the
    # report proper live in references.bib (not spellchecked) and are cited via
    # @citekey, so this exclusion matches the project's existing approach.
    - 'notes/202606281600-literature-review.md'
patterns:
  - name: qmd_frontmatter
    pattern: |
      /
          ^---\r?\n
          [\s\S]*?
          \r?\n---
      /gmx
  - name: markdown_inline_code
    pattern: |
      /
          `[^`\n]+`
      /gmx
  - name: markdown_bare_citation
    pattern: |
      /
          @[a-zA-Z][\w:.-]*
      /gmx
  - name: markdown_citation
    pattern: |
      /
          \[[^\[\]]*@[^\]]*\]
      /gmx
  - name: markdown_inline_math
    pattern: |
      /
          \$[^$\n]+\$
      /gmx
  - name: markdown_display_math
    pattern: |
      /
          ^\s*\$\$[^$\n]*
          [\s\S]*?
          ^\s*\$\$
      /gmx
  - name: markdown_code_block
    pattern: |
      /
          ^(\s*`{3,}).*
          [\s\S]*?
          ^\1
      /gmx
  - name: qmd_curly_braces
    pattern: |
      /
          \{[^}]*\}
      /gmx
ignoreRegExpList:
    - qmd_frontmatter
    - markdown_code_block
    - markdown_inline_code
    - markdown_bare_citation
    - markdown_citation
    - markdown_inline_math
    - markdown_display_math
    - qmd_curly_braces